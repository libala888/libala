<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>短信记录列表</title>
<style>p{border:1px solid #ccc;padding:8px;margin:6px;}</style>
</head>
<body>
<h2>全部接收短信</h2>
<div id="smsList"></div>
<script>
fetch("./data.json")
.then(res=>res.json())
.then(data=>{
  let html = "";
  data.forEach(item=>{
    html += `<p>发件号码：${item.sender}<br>短信内容：${item.body}<br>接收时间：${item.time}<br>保存时间：${item.saveAt}</p>`
  })
  document.getElementById("smsList").innerHTML = html;
})
</script>
</body>
</html>
